name: Release

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OIDC (trusted publishing) needs npm >= 11.5.1 and the node 22 runner ships
      # npm 10. Pinned to the major used locally, not `@latest`: `@latest` pulled
      # in npm 12, which changed the shape of `npm pack --json` and broke the
      # release mid-pipeline. Dropping this step entirely means moving the runner
      # to node 24, whose bundled npm already speaks OIDC.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test

      - name: LayoutCore host tests
        run: npm run test:cpp

      - name: Build lib
        run: npm run build

      - name: Verify the tarball npm would publish
        run: npm run verify:package

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: '${{ github.actor }}@users.noreply.github.com'
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: '${{ github.actor }}@users.noreply.github.com'
        run: npx semantic-release
